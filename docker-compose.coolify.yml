services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    mem_limit: ${DB_MEMORY_LIMIT:-256m}
    cpus: "${DB_CPUS:-0.50}"
    shm_size: ${DB_SHM_SIZE:-128mb}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-itsuka_bot}
      POSTGRES_USER: ${POSTGRES_USER:-itsuka}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES:-itsuka-postgres-password}
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS:---encoding=UTF8 --locale=C}
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-30}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-32MB}
    volumes:
      - postgres-data-18:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  bot:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    mem_limit: ${BOT_MEMORY_LIMIT:-384m}
    cpus: "${BOT_CPUS:-0.75}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-itsuka}:${SERVICE_PASSWORD_POSTGRES:-itsuka-postgres-password}@db:5432/${POSTGRES_DB:-itsuka_bot}
      DISCORD_TOKEN: ${DISCORD_TOKEN:?set DISCORD_TOKEN}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    command: python -m src.main

  migrate:
    build: .
    restart: "no"
    mem_limit: ${MIGRATE_MEMORY_LIMIT:-256m}
    cpus: "${MIGRATE_CPUS:-0.50}"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-itsuka}:${SERVICE_PASSWORD_POSTGRES:-itsuka-postgres-password}@db:5432/${POSTGRES_DB:-itsuka_bot}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    command: python -m src.database.migrate

  api:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    mem_limit: ${API_MEMORY_LIMIT:-384m}
    cpus: "${API_CPUS:-0.75}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-itsuka}:${SERVICE_PASSWORD_POSTGRES:-itsuka-postgres-password}@db:5432/${POSTGRES_DB:-itsuka_bot}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-itsuka-admin-password}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:-itsuka-session-secret-change-me-before-production}
      SECURE_COOKIE: ${SECURE_COOKIE:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-${SERVICE_URL_FRONTEND_3000:-https://itsuka.usapo.space}}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    command: uvicorn src.web.app:app --host 0.0.0.0 --port 8000
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        API_URL: http://api:8000
    restart: unless-stopped
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-512m}
    cpus: "${FRONTEND_CPUS:-1.00}"
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:8000
      NODE_ENV: production
      SERVICE_URL_FRONTEND_3000: ${SERVICE_URL_FRONTEND_3000:-https://itsuka.usapo.space}
    expose:
      - "3000"

volumes:
  postgres-data-18:
