[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
numReplicas = 1
sleepApplication = false
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# FastAPI 管理 API。Railway が割り当てる ${PORT} に bind するため、
# 環境変数の展開のために sh -c で包んで起動する。
startCommand = "sh -c 'uvicorn src.web.app:app --host 0.0.0.0 --port ${PORT}'"
