[project]
name = "itsuka-bot"
version = "0.1.0"
description = "Discord bot that auto-adds N reactions to messages in configured channels."
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.4",
    "SQLAlchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "greenlet>=3.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.20",
    "itsdangerous>=2.2",
    "PyJWT>=2.9",
    "python-dotenv>=1.0",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "httpx>=0.28",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
itsuka-bot = "src.main:run"
itsuka-web = "src.web.app:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "SIM",
]

[tool.ruff.lint.per-file-ignores]
"src/web/app.py" = ["B008", "E402"]  # FastAPI Depends + import order around side-effectful settings check
"src/web/routes/*.py" = ["B008"]      # FastAPI Depends() is the standard pattern

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
