[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
numReplicas = 1
sleepApplication = false
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Railway UI の Settings → Source → "Root Directory" に `/frontend` を
# 指定して使う。dockerfilePath は Root Directory からの相対。
# ${PORT} の展開のために sh -c で包む。
startCommand = "sh -c 'npm run start -- --port ${PORT:-3000} --hostname 0.0.0.0'"
