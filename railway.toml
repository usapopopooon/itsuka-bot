[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
numReplicas = 1
sleepApplication = false
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# startCommand はあえて指定しない。Dockerfile の CMD ("python -m src.main")
# が default で使われ、bot サービスはそれで動く。api サービスは Railway UI の
# Custom Start Command で uvicorn を指定する (toml に書くと UI で上書き
# できなくなり、同一リポを共有する複数サービスで詰むため)。
